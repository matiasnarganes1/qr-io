name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular (GitHub Pages base href)
        run: |
          npx ng build --configuration production --base-href "/qr-io/"

      - name: Prepare static site (SSR-safe)
        run: |
          # Detecta automáticamente dist/<app>/browser
          DIST_DIR="$(ls -d dist/*/browser | head -n 1)"
          echo "Using DIST_DIR=$DIST_DIR"

          mkdir -p _site
          cp -R "$DIST_DIR"/* _site/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4